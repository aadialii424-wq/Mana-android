# YE FILE COPY KARO — GitHub par .github/workflows/release-apk.yml banana ke liye
# (bot token workflow push nahi kar sakta, is liye 1 dafa manually banana parega)
name: Release MAYA APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (jaise v4.0.0)'
        required: true
        default: 'v4.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Code checkout
        uses: actions/checkout@v4

      - name: 2. Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Gradle 8.7 setup
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. APK BUILD
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 5. Release banayo + APK upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MAYA-${TAG}.apk
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "MAYA ${TAG} — Obsidian" \
            --notes "MAYA ${TAG} — Obsidian design, personas (Maya/Friday/Venom), themes, GF mode, memories. Install: APK kholo > Install anyway. (Play Protect warning aaye to Install anyway — apna hi code hai)"
          gh release upload "$TAG" "MAYA-${TAG}.apk" --clobber
          echo "DONE: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/MAYA-${TAG}.apk"
