name: Build MAYA APK

# Har push par automatically APK ban jayegi — ya manually "Run workflow" se
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Code checkout
        uses: actions/checkout@v4

      - name: 2. Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Gradle 8.7 setup
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. APK BUILD (3-6 minute)
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build-ci.log 2>&1
          CODE=$?
          tail -5 build-ci.log
          if [ $CODE -ne 0 ]; then
            echo "=== KOTLIN ERRORS ===" > ci-errors.txt
            grep -nE "^e: |error:|: error" build-ci.log | head -40 >> ci-errors.txt
            echo "=== TAIL ===" >> ci-errors.txt
            tail -40 build-ci.log >> ci-errors.txt
            git config user.name "ci-debug"
            git config user.email "ci-debug@users.noreply.github.com"
            git add ci-errors.txt .github/workflows/build-apk.yml
            git commit -m "CI-DEBUG: kotlin error dump [skip ci]"
            git push || true
          fi
          exit $CODE

      - name: 5. APK upload (download ke liye)
        uses: actions/upload-artifact@v4
        with:
          name: MAYA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
